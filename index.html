<!doctype html>
<html lang="zh-Hant">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>
    訂單管理
  </title>
  <link rel="stylesheet" href="style.css">
  <body>
    <header>
      <div>
        <small>
          ORDER MANAGER
        </small>
        <h1>
          訂單管理
        </h1>
      </div>
      <div>
        <span id="account">
        </span>
        <button id="login">
          Google 登入
        </button>
        <button id="logout" hidden>
          登出
        </button>
      </div>
    </header>
    <p id="message" role="status">
      請登入以管理你的訂單。
    </p>
    <main id="workspace" hidden>
      <section class="stats">
        <article>
          訂單總數
          <strong id="count">
            0
          </strong>
        </article>
        <article>
          總金額（TWD）
          <strong id="total">
            0
          </strong>
        </article>
        <article>
          尚未下單
          <strong id="pending">
            0
          </strong>
        </article>
      </section>
      <section>
        <h2>
          商品管理
        </h2>
        <p id="productMessage" role="status">
          商品清單尚未載入。
        </p>
        <p>
          先建立商品名稱及規格，再從訂單下拉選單選取。每種規格建立一筆。
        </p>
        <form id="productForm" class="toolbar">
          <input id="productName" required maxlength="120" placeholder="商品名稱" aria-label="商品名稱">
          <input id="productSpec" required maxlength="120" placeholder="規格，例如：藍色／M" aria-label="商品規格">
          <button id="addProduct" type="submit">
            新增商品規格
          </button>
        </form>
        <ul id="products">
        </ul>
      </section>
      <section>
        <h2 id="formTitle">
          新增訂單
        </h2>
        <form id="orderForm">
          <div id="fields" class="grid">
          </div>
          <label class="check">
            <input name="ordered" type="checkbox">
            已向供應商下單
          </label>
          <div class="actions">
            <button type="submit" id="save">
              儲存訂單
            </button>
            <button type="button" id="cancel">
              清空／取消編輯
            </button>
          </div>
        </form>
      </section>
      <section>
        <div class="toolbar">
          <h2>
            訂單一覽
          </h2>
          <input id="search" placeholder="搜尋帳號、訂單、商品、來源" aria-label="搜尋訂單">
          <select id="filter" aria-label="下單篩選">
            <option value="all">
              全部訂單
            </option>
            <option value="pending">
              尚未下單
            </option>
            <option value="ordered">
              已下單
            </option>
          </select>
          <button id="export">
            匯出 CSV
          </button>
        </div>
        <p id="empty">
          目前沒有訂單。
        </p>
        <div class="tablewrap">
          <table>
            <thead>
              <tr>
                <th>
                  日期
                </th>
                <th>
                  來源／帳號
                </th>
                <th>
                  訂單／商品
                </th>
                <th>
                  數量
                </th>
                <th>
                  金額
                </th>
                <th>
                  支付／付款狀態
                </th>
                <th>
                  已下單
                </th>
                <th>
                  配送／狀態
                </th>
                <th>
                  操作
                </th>
              </tr>
            </thead>
            <tbody id="rows">
            </tbody>
          </table>
        </div>
      </section>
    </main>
    <script type="module" src="app.js?v=20261120-products2">
    </script>
  </body>
</html>
